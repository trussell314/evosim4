[workspace]
resolver = "2"
members = [
    "crates/evosim-protocol",
    "crates/evosim-engine",
    "crates/evosim-server",
    "crates/evosim-tui",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
constant_time_eq = "0.3"
rayon = "1.10"

# Internal
evosim-protocol = { path = "crates/evosim-protocol" }
evosim-engine = { path = "crates/evosim-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1
